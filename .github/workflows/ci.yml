name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --timeout 20
            --max-retries 3
            --retry-wait-time 10
            --accept 200,204,206,429
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
            --exclude 'https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)'
            --exclude 'https?://([a-z0-9-]+\.)*example\.(com|org)'
            --exclude 'https://t\.me/'
            --exclude 'https://discord\.gg/'
            --exclude 'https://(x|twitter)\.com/'
            --exclude 'https://portal\.nousresearch\.com'
            --exclude 'https://www\.npmjs\.com/'
            --exclude 'https://hermes-agent\.nousresearch\.com/docs/'
            'README.md' 'guide/**/*.md' 'templates/**/*.md' 'skills/**/*.md' 'CONTRIBUTING.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Official docs links are not checked here: the drift guard validates
      # every one of them (page + heading) against the pinned upstream docs.

  anchors:
    name: Relative links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python .github/scripts/check_anchors.py

  yaml:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet yamllint
      - run: yamllint -c .github/yamllint.yml templates/ .github/

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck every script shipped in this repo
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          [ "${#scripts[@]}" -eq 0 ] || shellcheck "${scripts[@]}"
