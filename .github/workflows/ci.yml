name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-links:
    name: link check (lychee + GH token)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lychee with a GitHub token: GitHub links are checked for real instead
      # of passing via a blanket 403/429 tolerance (the previous checker
      # treated every bot-blocked GitHub URL as alive — the largest link
      # class in this repo went effectively unchecked).
      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --timeout 20
            --max-retries 3
            --retry-wait-time 10
            --accept 200,204,206
            --exclude-path README-zh.md
            --exclude-path README-ja.md
            --exclude-path CHANGELOG.md
            --exclude 'https://t\.me/.*'
            --exclude 'https://hermes-agent\.nousresearch\.com.*'
            --exclude 'https?://(localhost|127\.0\.0\.1|0\.0\.0\.0).*'
            --exclude 'https?://.*yourdomain\.com.*'
            --exclude 'https://discord\.gg/.*'
            --exclude 'https://portal\.nousresearch\.com.*'
            --exclude 'https://x\.com/.*'
            '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  anchor-check:
    name: internal anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check relative links and #anchors resolve
        run: python .github/scripts/check_anchors.py

  yaml-lint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        # templates/ and benchmarks/ hold the shipped YAML; .github/ covers
        # this workflow, the yamllint config itself, and ISSUE_TEMPLATE/config.yml.
        run: yamllint -c .github/yamllint.yml templates/ benchmarks/ .github/

  skill-frontmatter:
    name: skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml
      - name: Validate every SKILL.md frontmatter
        run: python .github/scripts/validate_skills.py

  shell-syntax:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check all shell scripts
        run: |
          shopt -s nullglob
          rc=0
          for f in scripts/*.sh benchmarks/*.sh; do
            echo "bash -n $f"
            bash -n "$f" || rc=1
          done
          exit $rc

  python-syntax:
    name: python compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile-check every shipped Python script
        run: |
          rc=0
          for f in scripts/*.py benchmarks/*.py .github/scripts/*.py; do
            echo "py_compile $f"
            python -m py_compile "$f" || rc=1
          done
          exit $rc

  prettier-check:
    name: prettier (soft)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Prettier check (advisory only)
        run: npx -y prettier --check "**/*.md" || echo "::warning::prettier formatting drift (non-blocking)"
