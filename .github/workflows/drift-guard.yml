name: CLI drift guard

# Verifies every `hermes <subcommand>`, `/<slash-command>`, and config key
# referenced anywhere in the guide actually exists in the upstream Hermes
# Agent surface — pinned to the SAME tag the README claims to be synced with.
#
# Three surfaces, all AST/regex-parsed from upstream source (no install):
#   commands.txt       _BUILTIN_SUBCOMMANDS + plugin-registered CLI commands
#   slash-commands.txt COMMAND_REGISTRY in hermes_cli/commands.py (+ aliases)
#   config-keys.txt    DEFAULT_CONFIG paths + _EXTRA_KNOWN_ROOT_KEYS wildcards
#
# When upstream removes/renames anything the guide names, CI turns red
# instead of readers hitting a wall. When you bump UPSTREAM_TAG, bump the
# README badge in the same commit. See docs/evidence/README.md.

on:
  push:
    branches: [main]
    paths:
      - "part*.md"
      - "README.md"
      - "templates/**"
      - "scripts/audit-cli-surface.py"
      - "scripts/extract-upstream-surface.py"
      - ".github/workflows/drift-guard.yml"
  pull_request:
  schedule:
    # Re-check weekly even when the guide hasn't moved
    - cron: "0 9 * * 1"
  workflow_dispatch:

env:
  # The baseline this guide claims. Bump in lockstep with the README badge.
  UPSTREAM_TAG: "v2026.8.19"

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shallow-clone upstream Hermes Agent at the pinned tag
        run: |
          git clone --depth 1 --branch "$UPSTREAM_TAG" \
            https://github.com/NousResearch/hermes-agent.git /tmp/hermes-upstream

      - name: Extract the real command + config surface from upstream source
        run: |
          python scripts/extract-upstream-surface.py /tmp/hermes-upstream --out-dir /tmp/surface
          echo "=== real surface ==="
          wc -l /tmp/surface/commands.txt /tmp/surface/slash-commands.txt /tmp/surface/config-keys.txt

      - name: Audit guide references against the real surface
        run: |
          python scripts/audit-cli-surface.py \
            --commands-file /tmp/surface/commands.txt \
            --slash-file /tmp/surface/slash-commands.txt \
            --config-file /tmp/surface/config-keys.txt \
            --exit-on-drift

      - name: Publish evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-guard-receipts
          path: /tmp/surface/
          if-no-files-found: ignore
