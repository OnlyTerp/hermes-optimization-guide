name: Drift guard

# Checks every hermes command, flag, slash command, config key, env var and
# official-docs link in the guide against the Hermes Agent release the guide
# is pinned to. Also runs weekly so an upstream release that renames
# something shows up here before readers hit it.
#
# Bumping the pin: change HERMES_TAG below AND the "Verified against" line in
# README.md in the same commit, then fix whatever this job reports.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:

env:
  HERMES_TAG: "v2026.9.21"   # Hermes Agent v0.21.4

permissions:
  contents: read
  issues: write

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the pinned Hermes Agent release
        run: |
          git clone --depth 1 --branch "$HERMES_TAG" \
            https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          python -m pip install --quiet uv
          uv venv /tmp/venv --python 3.11
          uv pip install --python /tmp/venv/bin/python --quiet -e /tmp/hermes-agent pyyaml

      - name: Extract the real surface (CLI tree, slash commands, config schema, docs)
        env:
          HERMES_HOME: /tmp/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          /tmp/venv/bin/python scripts/drift_guard.py extract \
            --upstream /tmp/hermes-agent --out /tmp/surface.json

      - name: Check the guide against it
        run: /tmp/venv/bin/python scripts/drift_guard.py check --surface /tmp/surface.json

      - name: Lint skills with upstream's own skill linter
        env:
          HERMES_HOME: /tmp/hermes-home
        run: /tmp/venv/bin/python scripts/drift_guard.py lint-skills --upstream /tmp/hermes-agent

  upstream-watch:
    # Scheduled runs only: open an issue when Hermes ships a release newer than the pin.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Compare the pin with the latest upstream release
        id: latest
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/NousResearch/hermes-agent.git 'v20*' \
            | awk -F/ '{print $3}' | sort -V | tail -1)
          echo "pinned=$HERMES_TAG latest=$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$HERMES_TAG" ]; then echo "behind=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open (or reuse) a refresh issue
        if: steps.latest.outputs.behind == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const latest = "${{ steps.latest.outputs.latest }}";
            const pinned = process.env.HERMES_TAG;
            const title = `Hermes ${latest} is out — guide is pinned to ${pinned}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: [
                `Upstream released **${latest}**; the guide is verified against **${pinned}**.`,
                "",
                "To refresh:",
                "1. Read the release notes: https://github.com/NousResearch/hermes-agent/releases/tag/" + latest,
                "2. Bump `HERMES_TAG` in `.github/workflows/drift-guard.yml` and the \"Verified against\" line in `README.md`.",
                "3. Fix whatever the drift guard reports, then review chapters touched by the release notes.",
              ].join("\n"),
            });
