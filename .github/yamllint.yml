extends: default

# Goal: catch real YAML syntax errors in shipped templates and workflows,
# not formatting nits. CI runs: yamllint -c .github/yamllint.yml templates/ .github/

rules:
  line-length: disable
  document-start: disable
  comments: disable
  comments-indentation: disable
  indentation: disable
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']
    check-keys: false
