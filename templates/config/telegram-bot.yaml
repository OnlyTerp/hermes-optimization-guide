# ------------------------------------------------------------
# Hermes — TELEGRAM BOT config
# ------------------------------------------------------------
# Opinionated setup for a personal Telegram assistant:
#   - Anthropic primary + Gemini Flash for the cheap auxiliary tasks
#   - Telegram gateway (token + allowlist live in ~/.hermes/.env — see below)
#   - Native local memory (Part 7); add LightRAG later via Part 3
#   - Sensible approval defaults
# Schema verified against the v0.20.4 docs (user-guide/configuration.md,
# user-guide/configuring-models.md, user-guide/messaging/telegram.md).
# Model IDs follow the live catalog (`hermes model`).
# ------------------------------------------------------------

# Primary model — drives the tool-calling loop. Mapping shape as written
# by `hermes model` / the dashboard.
model:
  provider: anthropic
  default: claude-sonnet-5

# API keys live in ~/.hermes/.env (ANTHROPIC_API_KEY, GOOGLE_API_KEY or
# GEMINI_API_KEY). The providers: dict is only for custom endpoints, so
# there is nothing to declare here for the built-in providers.

# Anthropic prompt caching — on automatically for native Anthropic /
# OpenRouter / Nous Portal; cache_ttl is the only knob.
prompt_caching:
  cache_ttl: "5m"                    # "5m" or "1h" — the only two Anthropic tiers

# Route the side-tasks (classification-ish work) to a cheap model.
auxiliary:
  compression:
    provider: gemini
    model: gemini-3.7-flash
  web_extract:
    provider: gemini
    model: gemini-3.7-flash
  vision:
    provider: gemini
    model: gemini-3.7-flash          # needs a multimodal model

# ------------------------------------------------------------
# Telegram wiring lives in ~/.hermes/.env, not here (Part 4):
#
#   TELEGRAM_BOT_TOKEN=<from @BotFather>
#   TELEGRAM_ALLOWED_USERS=<your-numeric-user-id>   # comma-separated
#
# Hermes is default-deny: no allowlist = nobody gets in. Never set
# GATEWAY_ALLOW_ALL_USERS=true on a bot strangers can find.
#
# Want a public-facing bot too? Run it as a SEPARATE profile (its own
# config + .env + bot token) — `hermes profile create quarantine`, then
# `hermes -p quarantine gateway run`. See Part 19 and
# templates/config/security-hardened.yaml. Don't mix trust levels in
# one deployment.
# ------------------------------------------------------------

group_sessions_per_user: true        # Each group participant gets an isolated session

# Dangerous-command approval (Part 19, Layer 2). The dangerous patterns
# are built into Hermes — you don't write regex here.
approvals:
  mode: manual                       # manual | smart (default) | off
  timeout: 60                        # seconds before fail-closed deny (default 300)
  cron_mode: deny                    # cron jobs never auto-approve dangerous commands

# "Always approve" pattern descriptions land here when you answer
# "always" at a prompt. Start empty; review anything that appears.
command_allowlist: []

security:
  redact_secrets: true               # default on — keep it on

# Cron jobs live in ~/.hermes/cron/jobs.json, managed via `hermes cron
# create` / the cronjob tool (the old cron.yaml list is gone). Example:
#   hermes cron create "0 3 * * *" "Run the nightly backup skill" \
#     --skill nightly-backup --name nightly-backup --deliver telegram
