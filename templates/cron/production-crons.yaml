# ------------------------------------------------------------
# Hermes cron wiring — production defaults (v0.20.4 reference)
# ------------------------------------------------------------
# Since v0.19/v0.20, scheduled jobs are stored in ~/.hermes/cron/jobs.json
# and managed ONLY through `hermes cron create/edit/pause/resume/remove`,
# the `cronjob` agent tool, or `/cron` in chat. The old YAML-list format
# (name/schedule/task/notify in ~/.hermes/cron.yaml) was removed — this
# file is a commented reference of the equivalent `hermes cron create`
# commands for every skill shipped in skills/. Nothing here is loaded by
# Hermes; copy the commands you want and run them as your user.
#
# All skills referenced below are in skills/ — install them into the
# profile first (see skills/README.md).
#
# Delivery targets (--deliver): telegram, discord, slack, whatsapp,
# signal, matrix, email, ... or "telegram:chat_id" / "local" / "origin".
# No-agent jobs: `--no-agent --script <name.sh>` runs a script under
# ~/.hermes/scripts/ on schedule and delivers its stdout verbatim.
# ------------------------------------------------------------

# Nightly backup (s3 target, 30-day retention inside the skill):
#   hermes cron create "0 3 * * *" \
#     "Run the nightly-backup skill: remote=s3://backups/hermes/ retain_days=30" \
#     --skill nightly-backup --name nightly-backup --deliver telegram

# Weekly MCP audit:
#   hermes cron create "0 9 * * 1" \
#     "Audit every configured MCP server (tool filtering, credential scope)" \
#     --skill audit-mcp --name weekly-mcp-audit --deliver telegram

# Weekly approval-bypass audit:
#   hermes cron create "0 10 * * 1" \
#     "Audit every approval-bypass surface (approvals mode, allowlist, cron)" \
#     --skill audit-approval-bypass --name weekly-bypass-audit --deliver telegram

# Weekly cost report:
#   hermes cron create "0 11 * * 1" \
#     "Run the cost-report skill (window 7d, markdown)" \
#     --skill cost-report --name weekly-cost-report --deliver telegram

# Weekly dependency audit:
#   hermes cron create "0 12 * * 1" \
#     "Audit dependencies across configured repos, severity floor high" \
#     --skill weekly-dep-audit --name weekly-dep-audit --deliver telegram

# Monthly secret rotation — HMAC/webhook kinds only (see the skill's
# headless note; "all" must run interactively from an admin DM/CLI):
#   hermes cron create "0 4 1 * *" \
#     "Rotate the matching webhook HMAC secrets (webhook_hmac_*)" \
#     --skill rotate-secrets --name monthly-secret-rotation --deliver telegram

# Disk watchdog — no-agent script job, zero LLM cost, stdout delivered.
# Put this in ~/.hermes/scripts/disk-watchdog.sh first (chmod +x):
#   #!/bin/sh
#   df -h / | awk 'NR==2 && $5+0 > 85 {print "Disk usage high: "$5}'
# Then:
#   hermes cron create "*/15 * * * *" --no-agent \
#     --script disk-watchdog.sh --name disk-watchdog --deliver telegram

# Morning digest (only if you have a newsroom / status page / etc.):
#   hermes cron create "0 7 * * *" \
#     "Summarize the latest Hermes/MCP/LLM-security news" \
#     --name morning-digest --deliver telegram

# Inspect / manage:
#   hermes cron list          # what's scheduled + last status
#   hermes cron run <job-id>  # trigger on next scheduler tick
#   hermes cron pause <job-id> / resume <job-id>
#   hermes cron edit <job-id> --skill ... --deliver ... [--model ...]
#
# Security note: keep these skills read-only — with approvals.cron_mode:
# deny (see templates/config/*.yaml) a cron job that trips a dangerous
# command is blocked headlessly, and the run records a failed status.
